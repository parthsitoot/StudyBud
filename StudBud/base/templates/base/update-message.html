{% extends 'main.html' %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 50vh;">
    <div class="card" style="width: 100%; max-width: 500px;">
        <h2 style="margin-bottom: 1.5rem;">Update Message</h2>
        
        <form method="POST" action="">
            {% csrf_token %}
            <textarea name="body" rows="4" placeholder="Type your message...">{{obj.body}}</textarea>
            
            <div style="display: flex; gap: 10px; margin-top: 1rem;">
                <a href="{{request.META.HTTP_REFERER}}" class="btn btn-outline">Cancel</a>
                <input type="submit" value="Update" class="btn" />
            </div>
        </form>
    </div>
</div>
{% endblock %}
