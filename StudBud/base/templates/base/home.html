{% extends 'main.html' %}

{% block content %}

<style>
    .home-container {
        display : grid;
        grid-template-columns: 1fr 3fr;
    }
</style>


<div class="home-container">

    <div>
        <h3>Browse Topics</h3>
        <hr>
        <div>
            <a href="{% url 'home' %}">All</a>
        </div>
        {% for topic in topics %}
            <div>
                <a href="{% url 'home' %}?q={{topic.name}}">{{topic.name}}</a>
            </div>
        {% endfor %}
    </div>
    

    <div>
         <a href="{% url 'create-room' %}">
            <h3><button><h3>Create Room</h3></button></h3>
        </a>
        {% for room in rooms %}
            <div>
                <a href="{% url 'update-room' room.id %}">Edit</a>
                <a href="{% url 'delete-room' room.id %}">Delete</a>
                <span>@{{room.host.username}}</span>
                <h3><a href="{% url 'room' room.id %}">{{room}}</a> </h3>
                <small>Topic: {{room.topic.name}}</small>
                <hr>
            </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
