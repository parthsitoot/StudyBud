{% extends 'main.html' %}

{% block content %}
<div style="display: flex; justify-content: center; padding-top: 3rem;">
    <div class="card" style="width: 100%; max-width: 500px;">
        <h2 style="margin-bottom: 1.5rem;">Create New Topic</h2>
        
        <form method="POST" action="">
            {% csrf_token %}
            {{ form.as_p }}
            
            <div style="margin-top: 1.5rem;">
                <a href="{{request.META.HTTP_REFERER}}" class="btn btn-outline" style="margin-right: 10px;">Cancel</a>
                <input type="submit" value="Create Topic" class="btn" />
            </div>
        </form>
    </div>
</div>
{% endblock %}
