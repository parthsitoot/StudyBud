<div>
    <h3>Recent Activities</h3>
    <hr>
    {% for activity in activities %}
        <div>
            <li><small><a href="{% url 'user-profile' activity.user.id %}">{{activity.user}}</a>: {{activity.updated | timesince}}</small></li>
            <small>Replied to: {{activity.room}}</small>
            <p>{{activity.body}}</p>
        </div>
    {% endfor %}
</div>
