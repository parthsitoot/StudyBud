{% extends 'main.html' %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; height: 60vh;">
    <div class="card" style="text-align: center; max-width: 500px;">
        <h2 style="margin-bottom: 1rem;">Delete Confirmation</h2>
        
        <form method="POST" action="">
            {% csrf_token %}
            <p style="margin-bottom: 2rem; color: var(--text-muted);">
                Are you sure you want to delete <strong>"{{obj}}"</strong>? This action cannot be undone.
            </p>
            
            <a href="{{request.META.HTTP_REFERER}}" class="btn btn-outline" style="margin-right: 10px;">Go Back</a>
            <input type="submit" value="Confirm Delete" class="btn btn-danger" />
        </form>
    </div>
</div>
{% endblock %}
