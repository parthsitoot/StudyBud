<nav class="navbar">
    <a href="/" class="nav-logo">STUDBUD</a>

    <form class="search-bar" method="GET" action="{% url 'home' %}">
        <input type="text" name="q" placeholder="Search rooms..." autocomplete="off" />
    </form>

    <div class="nav-links">
        {% if request.user.is_authenticated %}
            <a href="{% url 'user-profile' request.user.id %}">
                Hello, {{request.user.username}}
            </a>
            <a href="{% url 'logout' %}" style="color: var(--text-muted);">Logout</a>
        {% else %}
            <a href="{% url 'login' %}" class="btn">Login</a>
        {% endif %}
    </div>
</nav>
